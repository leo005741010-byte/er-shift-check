<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#13606e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="急診點班">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>急診點班</title>
<style>
:root{--navy:#13606e;--navy-dark:#0c4651;--bg:#f2f6f7;--card:#fff;--line:#dbe5e8;--txt:#1f2d3d;--mut:#667785;
  --ok:#1f8a4c;--okbg:#e6f5ec;--warn:#a85800;--warnbg:#fff4e0;--bad:#c0392b;--badbg:#fdecea}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.55}
button{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header.top{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top .wrap{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
header.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px}
main.wrap{padding-top:14px;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.mut{color:var(--mut)}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-size:14px}
.btn:hover{background:var(--navy-dark)}
.btn.outline{background:#fff;color:var(--navy)}
.btn.outline:hover{background:#eef6f7}
.btn.ghost{background:transparent;color:var(--mut);border-color:var(--line)}
.btn.mini{font-size:12.5px;padding:3px 10px;border-radius:6px}
.btn.big{font-size:17px;padding:12px 18px;border-radius:12px;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
details.sec>summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px;font-weight:700;color:var(--navy-dark);list-style:none;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'▸';color:var(--mut);font-size:15px;transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec[open]>summary{margin-bottom:12px}
details.sec>summary .r{margin-left:auto;font-weight:400;font-size:13px;color:var(--mut)}
.hint{font-size:12.5px;color:var(--mut);margin:2px 0 10px}
.note{border-radius:9px;padding:9px 13px;font-size:13.5px;margin-bottom:12px}
.note.warn{background:var(--warnbg);color:var(--warn);border:1px solid #f3d9a4}
.note.bad{background:var(--badbg);color:var(--bad);border:1px solid #f1b9b3}
.note.info{background:#e8f4f5;color:var(--navy-dark);border:1px solid #c4e0e3}
.note b{font-weight:700}
pre.rule{background:#0f2238;color:#e8f0fa;border-radius:8px;padding:10px 12px;font-size:12.5px;overflow:auto;white-space:pre;user-select:all;margin:8px 0 0}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.no{background:var(--badbg);color:var(--bad)}.tag.w{background:var(--warnbg);color:var(--warn)}.tag.g{background:#eef2f4;color:var(--mut)}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:18px;line-height:2}
.foot .lk{background:none;border:none;color:var(--navy);text-decoration:underline;cursor:pointer;padding:0 2px;font-size:12.5px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2d3d;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:.95}
input[type=number],input[type=text],input[type=password],input[type=date],select,textarea{font:inherit;font-size:16px;border:1px solid #c5d3d8;border-radius:8px;padding:6px 9px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid #8fc4cb;outline-offset:0}

/* ---- 本班標題＋進度 ---- */
.shead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 4px}
.shead h2{font-size:21px;margin:0;color:var(--navy-dark)}
.shead .t{color:var(--mut);font-size:13px}
.shead .now{font-size:12px;background:#e0f1f3;color:var(--navy);border-radius:999px;padding:1px 9px;font-weight:700}
.prog{display:flex;align-items:center;gap:10px;margin:6px 0 4px;font-size:14px}
.prog .bar{flex:1;height:8px;border-radius:4px;background:#e3eaed;overflow:hidden}
.prog .bar span{display:block;height:100%;background:#2eb872}
.duty{font-size:12.5px;color:var(--mut);margin:0 0 12px}
.grp{font-size:13px;color:var(--mut);font-weight:700;margin:16px 2px 6px}
/* ---- 點班單列表 ---- */
.flist{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--txt)}
.frow:active{background:#f3f8f9}
.frow .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;background:#cfd8dc}
.frow.ok .dot{background:#2eb872}.frow.bad .dot{background:#f2a541}.frow.part .dot{background:#8fc4cb}
.frow .fn{flex:1;min-width:0;font-size:16px;font-weight:700;color:var(--navy-dark)}
.frow .fn small{display:block;font-size:12.5px;font-weight:400;color:var(--mut)}
.frow .fs{font-size:13px;text-align:right;white-space:nowrap}
.frow.ok .fs{color:var(--ok)}.frow.bad .fs{color:var(--warn);font-weight:700}
.frow .chev{color:#a9b7bd;font-size:20px}

/* ---- 最下面一條：‹ 日期班別 › ---- */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(12,70,81,.08);
  display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.mb-nav{font-size:22px;line-height:1;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
.mb-nav:disabled{opacity:.3;cursor:default}
.mb-cur{font-size:16px;font-weight:700;color:#fff;background:var(--navy);border:none;border-radius:999px;padding:10px 18px;min-width:200px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.mb-cur i{width:9px;height:9px;border-radius:50%;display:inline-block;background:#c5ced9}
.mb-cur i.done{background:#2eb872}.mb-cur i.part{background:#f2a541}.mb-cur i.none{background:#e2574c}
.pick{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:31;display:none;justify-content:center;padding:0 12px}
.pick.on{display:flex}
.pick .box{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 34px rgba(12,70,81,.25);padding:14px;width:100%;max-width:380px}
.pick .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pick .sh{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pick .sh button{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
.pick .sh button.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.pick .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick .grid .m{font-size:15px;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.pick .grid .m:disabled{color:#c2cad4;background:#f7f9fb;cursor:default}
.pick .grid .m.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.pick .grid .m.now{border-color:var(--navy)}
.pick .yr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:17px;color:var(--navy-dark)}

/* ---- 點班單畫面（整頁） ---- */
.fv{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.fv.on{display:flex}
.fv .fh{background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.fv .fh .back{background:none;border:none;color:#fff;font-size:26px;width:40px;height:40px;cursor:pointer;line-height:1}
.fv .fh .ft{flex:1;min-width:0}
.fv .fh .ft b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fv .fh .ft small{font-size:12.5px;opacity:.85}
.fv .fb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px}
.fv .fb>.in{max-width:760px;margin:0 auto}
.fv .fs2{background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(12,70,81,.08)}
.fv .fs2 .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.fv .fs2 .cnt{font-size:14px;white-space:nowrap}
.fv .fs2 .btn{flex:1;font-size:16px;padding:11px 12px;border-radius:12px}
.secb{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.secb>.sh2{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#eef5f6;border-bottom:1px solid var(--line)}
.secb>.sh2 b{flex:1;color:var(--navy-dark);font-size:15px}
.secb>.sh2 small{color:var(--mut);font-weight:400;margin-left:6px}
.it{padding:9px 12px;border-bottom:1px solid #edf1f3}
.it:last-child{border-bottom:none}
.it.ng{background:#fff7f6}
.it.miss{background:#fff8e6}
.ir{display:flex;align-items:center;gap:10px}
.itx{flex:1;min-width:0}
.itx .nm{font-size:15px;line-height:1.4;word-break:break-word}
.itx .sub{font-size:12.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap}
.itx .q{color:var(--navy);font-weight:700}
.ib{display:flex;gap:6px;flex:0 0 auto}
.ib .b{width:46px;height:42px;border-radius:10px;border:1.5px solid #cfdade;background:#fff;font-size:20px;line-height:1;cursor:pointer;color:#9aaab0}
.ib .b.ok.on{background:#2eb872;border-color:#2eb872;color:#fff}
.ib .b.ng.on{background:#e2574c;border-color:#e2574c;color:#fff}
.ib .b.na.on{background:#8a98a3;border-color:#8a98a3;color:#fff}
.ro{width:40px;text-align:center;font-size:19px;font-weight:700;color:#aab6bb}
.ro.ok{color:var(--ok)}.ro.ng{color:var(--bad)}.ro.na{color:var(--mut)}
.ngx{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.ngx label{font-size:14px}
.ngx input[type=number]{width:90px;text-align:right}
.ngx input.note{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #c4dade;background:#f2f8f9;color:var(--navy-dark);border-radius:999px;padding:4px 12px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.fix{font-size:13.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.fix input{width:18px;height:18px}
.ngro{font-size:13px;color:var(--bad);margin-top:3px}
.ngro .res{color:var(--ok)}
.stp{display:inline-flex;align-items:center;border:1px solid #c5d3d8;border-radius:10px;overflow:hidden;background:#fff}
.stp button{width:40px;height:40px;border:none;background:#f2f8f9;font-size:20px;color:var(--navy);cursor:pointer}
.stp input{width:56px;height:40px;border:none;border-left:1px solid #e3eaed;border-right:1px solid #e3eaed;border-radius:0;text-align:center;font-size:18px;font-weight:700;padding:0}
.nar{display:grid;grid-template-columns:auto auto;gap:8px 12px;align-items:center;margin-top:8px}
.nar .lb{font-size:14px;color:var(--mut)}
.tot{font-size:15px;margin-top:8px}
.tmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tmp label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.tmp input{width:100%;text-align:center;font-size:20px;font-weight:700}
.clock{text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.clock b{display:block;font-size:34px;font-variant-numeric:tabular-nums;color:var(--navy-dark);letter-spacing:1px}
.clock small{color:var(--mut);font-size:12.5px}
.done{background:var(--okbg);border:1px solid #bfe5cd;color:var(--ok);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.done.bad{background:var(--warnbg);border-color:#f3d9a4;color:var(--warn)}
.done b{font-size:15px}
.done .acts{margin-left:auto;display:flex;gap:6px}
details.notes{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:13.5px}
details.notes summary{cursor:pointer;color:var(--navy-dark);font-weight:700}
details.notes ol{margin:6px 0 0;padding-left:20px}
.soakrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #edf1f3}
.soakrow:last-child{border-bottom:none}
.soakrow .w{flex:1;min-width:0}
.soakrow .w small{display:block;color:var(--mut);font-size:12.5px}
.soakrow .min{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.soakrow .min.go{color:var(--ok)}
/* ---- 選名字 ---- */
.who h2{font-size:18px;color:var(--navy-dark);margin:0 0 4px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:8px 0 14px}
.names button{padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer;color:var(--txt)}
.names button.duty{border-color:var(--navy);background:#eef6f7;font-weight:700;color:var(--navy-dark)}

/* ---- 管理頁 ---- */
.mhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.mhead h2{font-size:22px;margin:0;color:var(--navy-dark)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;position:relative;text-align:left;color:var(--txt)}
.tile:hover{border-color:#8fc4cb;box-shadow:0 2px 10px rgba(19,96,110,.12)}
.tile .l{font-size:12.5px;color:var(--mut)}
.tile .v{font-size:25px;font-weight:700;color:var(--navy-dark);font-variant-numeric:tabular-nums;line-height:1.25}
.tile .v small{font-size:14px;font-weight:400}
.tile .s{font-size:12.5px;color:var(--mut)}
.tile .tg{position:absolute;top:7px;right:10px;font-size:13px;opacity:.6}
.tile.big{background:#e8f4f5;border-color:#c9e3e6;text-align:center;padding:14px}
.tile.big .v{font-size:32px}
.tile.big .l{font-size:14px;color:var(--navy-dark);font-weight:600}
.tile .pbar{height:6px;border-radius:3px;background:#d7e6e9;margin:6px 0 2px;overflow:hidden}
.tile .pbar span{display:block;height:100%;background:#2eb872}
.up{color:var(--ok);font-weight:700}.dn{color:var(--warn);font-weight:700}
.dayrow{border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:none}
.dayrow>summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 2px;cursor:pointer;list-style:none}
.dayrow>summary::-webkit-details-marker{display:none}
.dayrow>summary .d{font-weight:700;min-width:86px;color:var(--navy-dark)}
.dayrow>summary .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.dayrow .body{padding:0 2px 12px}
.frm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.frm:last-child{border-bottom:none}
.frm .n{min-width:112px;font-weight:600}
.cell{border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 8px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--txt)}
.cell.ok{background:var(--okbg);border-color:#bfe5cd;color:var(--ok)}
.cell.bad{background:var(--warnbg);border-color:#f3d9a4;color:var(--warn);font-weight:700}
.cell.miss{background:var(--badbg);border-color:#f1b9b3;color:var(--bad);cursor:default}
.cell.wait{color:#a9b7bd;cursor:default}
.abn{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.abn:last-child{border-bottom:none}
.abn .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.abn .h b{color:var(--navy-dark)}
.abn .h .btn{margin-left:auto}
.abn .t{color:var(--mut);font-size:13px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px}
table.mt{border-collapse:collapse;font-size:12.5px}
table.mt th,table.mt td{border:1px solid #e3eaed;padding:3px 4px;text-align:center;white-space:nowrap}
table.mt th{background:#f1f6f7;color:var(--navy-dark);font-weight:700}
table.mt td.l,table.mt th.l{text-align:left;position:sticky;left:0;background:#fff;z-index:1;max-width:190px;white-space:normal;min-width:150px}
table.mt th.l{background:#f1f6f7}
table.mt td.x{color:var(--bad);font-weight:700;background:#fff3f1}
table.mt td.o{color:var(--ok)}
table.mt td.vn{writing-mode:vertical-rl;font-size:11.5px;letter-spacing:1px;padding:4px 2px;min-height:44px}
table.ed{border-collapse:collapse;width:100%;font-size:14px}
table.ed td,table.ed th{padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ed th{font-size:12.5px;color:var(--mut);text-align:left}
table.ed input,table.ed select{font-size:14px;padding:4px 6px;width:100%}
table.ed td.q input{width:64px}
table.ed td.act{white-space:nowrap}
table.ed td.act button{border:1px solid var(--line);background:#fff;border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--mut)}
.edrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.edrow label{font-size:13.5px;color:var(--mut)}
.edsec{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
.edsec .eh{display:flex;gap:8px;align-items:center;background:#eef5f6;padding:8px 10px}
.edsec .eh input{flex:1;min-width:0;font-weight:700;color:var(--navy-dark);font-size:15px}
.edi{padding:9px 10px;border-top:1px solid #edf1f3}
.edi .nm{width:100%;font-size:15px}
.edi .r2{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:6px}
.edi .r2 label{font-size:13.5px;color:var(--mut)}
.edi .qv{width:66px;font-size:17px;padding:5px 4px;font-weight:700;color:var(--navy-dark);border-color:#8fc4cb;background:#fbfeff;text-align:center}
.edi .qv.chg{border-color:#f2a541;background:#fff8ea}
.edi select{font-size:13.5px;padding:5px 2px;max-width:82px}
.edi .r2 .mv:first-of-type{margin-left:auto}
.edi .sp{flex:1}
.edi .mv{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:34px;color:var(--mut);cursor:pointer;font-size:15px}
.edi .subi{width:100%;margin-top:6px;font-size:13px;color:var(--mut)}
.mask{position:fixed;inset:0;background:rgba(12,70,81,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:30px 10px;overflow:auto}
.mask.on{display:flex}
.dlg{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg h2{margin:0 0 4px;font-size:18px;color:var(--navy-dark);display:flex;align-items:center;gap:8px}
.dlg h2 .btn{margin-left:auto}
.cumh{font-weight:700;color:var(--navy-dark);font-size:14.5px;margin:12px 0 0}
.cumh small{font-weight:400;color:var(--mut);margin-left:6px}
.trend{display:block;width:100%;max-width:560px;height:auto;margin:6px auto 10px}

const FB_DB='https://tenchener-488d2-default-rtdb.firebaseio.com', NODE='erShiftCheckData', SCHED='erNurseScheduleData';
const FB_API_KEY='AIzaSyB6w2D8gaqSBHoDmtWsWGWGY-DQtDEcyFY';   // Firebase Web API key：本來就設計成公開內嵌，不是密碼
const RULE=`"${NODE}": { ".read": "auth != null", ".write": "auth != null" }`;
let _tok=null,_tokExp=0,_tokP=null;
async function idToken(force){
  if(!force&&_tok&&Date.now()<_tokExp) return _tok;
  if(_tokP&&!force) return _tokP;
  _tokP=(async()=>{
    const keep=d=>{ _tok=d.idToken||d.id_token; _tokExp=Date.now()+(Number(d.expiresIn||d.expires_in||3600)-60)*1000;
      const rt=d.refreshToken||d.refresh_token; if(rt) lsSet(LS.rt,rt); return _tok; };
    const rt=lsGet(LS.rt,null);
    if(rt){ const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_API_KEY}`,{method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)});
      if(r.ok) return keep(await r.json()); }
    const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB_API_KEY}`,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
    if(!r.ok) throw new Error('雲端登入失敗（HTTP '+r.status+'）');
    return keep(await r.json());
  })();
  try{ return await _tokP; } finally{ _tokP=null; }
}
async function fb(method,path,body,base,q){
  for(let i=0;;i++){
    const r=await fetch(`${FB_DB}/${base||NODE}/${path}.json?auth=${encodeURIComponent(await idToken(i>0))}${q||''}`,
      {method,cache:'no-store',body:body===undefined?undefined:JSON.stringify(body)});
    if(r.ok) return r.json();
    const msg=await r.text().catch(()=>'');
    if((r.status===401||r.status===403)&&i===0&&/expired|invalid|token/i.test(msg)) continue;   // 憑證過期：重拿一次
    if(r.status===401||r.status===403) throw Object.assign(new Error('雲端規則尚未開放'),{kind:'denied'});
    throw new Error('雲端回應 HTTP '+r.status);
  }
}
// 這支手機上的雲端副本（只放讀過的部分），路徑和雲端一樣：rec/2026-10/d14/cart_D
let db=MANAGE?{}:lsGet(LS.cache,{});

const cloud={st:'idle',at:0,msg:''};
const getAt=path=>path.split('/').reduce((o,k)=>o&&typeof o==='object'?o[k]:undefined,db);
function setAt(path,val,merge){
  const ks=path.split('/'); let o=db;
  for(let i=0;i<ks.length-1;i++){ if(!o[ks[i]]||typeof o[ks[i]]!=='object') o[ks[i]]={}; o=o[ks[i]]; }
  const k=ks[ks.length-1];
  if(val==null) delete o[k];
  else if(merge&&o[k]&&typeof o[k]==='object') Object.assign(o[k],val);
  else o[k]=val;
}
function saveCache(){
  if(MANAGE) return;
  const lim=addDays(ymd(new Date()),-3), keepM=new Set([mkey(ymd(new Date())),shiftMonth(mkey(ymd(new Date())),-1)]);   // 手機上只留最近幾天
  Object.keys(db.rec||{}).forEach(mk=>{ const o=db.rec[mk]; if(!o||typeof o!=='object') return;
    Object.keys(o).forEach(dk=>{ if(/^d\d\d$/.test(dk)&&`${mk}-${dk.slice(1)}`<lim&&(!view||`${mk}-${dk.slice(1)}`!==view.d)) delete o[dk]; });
    if(!keepM.has(mk)&&!Object.keys(o).some(k=>k!=='_m')) delete db.rec[mk]; });
  Object.keys(db.soak||{}).forEach(mk=>{ if(!keepM.has(mk)) delete db.soak[mk]; });
  lsSet(LS.cache,db);
}
async function pull(path){
  try{
    const v=await fb('GET',path);
    setAt(path,v);
    outbox.forEach(o=>{ if(o.p===path||o.p.startsWith(path+'/')) setAt(o.p,o.b,o.m==='PATCH'); });   // 還沒傳上去的，蓋回本機副本
    cloud.st='ok'; cloud.at=Date.now(); saveCache();
    return true;
  }catch(e){ cloud.st=e.kind==='denied'?'denied':'off'; cloud.msg=e.message; return false; }
}
function write(m,path,body){
  setAt(path,body,m==='PATCH');
  // 同一個位置重複寫（例如改了又改）只留最後一筆
  if(m==='PUT') outbox=outbox.filter(o=>!(o.p===path&&o.m==='PUT'));
  outbox.push({m,p:path,b:body,t:Date.now()}); lsSet(LS.out,outbox); saveCache();
  flush(true);
}
let _flushing=false;
async function flush(fromWrite){
  if(_flushing||!outbox.length) return; _flushing=true;
  try{
    while(outbox.length){ const o=outbox[0]; await fb(o.m,o.p,o.b); outbox.shift(); lsSet(LS.out,outbox); }
    cloud.st='ok'; cloud.at=Date.now();
    if(!MANAGE&&!fvs) renderNurse();
  }catch(e){ cloud.st=e.kind==='denied'?'denied':'off'; cloud.msg=e.message;
    if(!MANAGE&&!fvs){ renderNurse(); if(fromWrite) toast(cloud.st==='denied'?'雲端還沒開通，紀錄先存在這支手機':'沒有網路，紀錄先存在這支手機，連上後自動上傳'); } }
  finally{ _flushing=false; renderFootOnly(); }
}

let sched=lsGet(LS.sched,{nurses:[],days:{},at:0});
async function loadSched(dates){
  try{
    if(!sched.nurses.length||Date.now()-sched.at>6*3600e3){
      const docs=await fb('GET','doctors',undefined,SCHED);
      const arr=Array.isArray(docs)?docs:Object.values(docs||{});
      sched.nurses=arr.filter(n=>n&&n.id&&n.name).map(n=>({id:String(n.id),name:String(n.name).trim()}));
      sched.at=Date.now();
    }
    for(const d of dates){
      if(sched.days[d]&&Date.now()-(sched.days[d]._at||0)<30*60e3) continue;
      const v=await fb('GET','schedule/'+d,undefined,SCHED)||{};
      sched.days[d]={D:v.D||[],E:v.E||[],N:v.N||[],_at:Date.now()};
    }
    const keep=new Set([...dates,ymd(new Date()),addDays(ymd(new Date()),-1)]);
    Object.keys(sched.days).forEach(d=>{ if(!keep.has(d)&&Object.keys(sched.days).length>8) delete sched.days[d]; });
    lsSet(LS.sched,sched);
  }catch(e){}
}

function evalItem(f,it,dr){

    const lo=f.lo==null?2:+f.lo, hi=f.hi==null?8:+f.hi; return [x.now,x.max,x.min].every(v=>+v>=lo&&+v<=hi)?1:0; }

async function submitForm(){
  if(_submitting) return;
  const {f,d,k,dr}=fvs, p=progressOf(f,dr);
  if(p.miss.length){
    fvs.showMiss=p.miss; renderForm();
    const el=$('it-'+p.miss[0]); if(el) el.scrollIntoView({block:'center',behavior:'smooth'});

    return;
  }
  // 送出前再看一次雲端：別人剛好也點了同一張，先問再蓋

  const before=fvs.rec;
  if(k==='M') await pull(`rec/${mkey(d)}/_m/${f.id}`); else await pull(recPath(d,f,k));
  _submitting=false;
  if(!fvs||fvs.f!==f) return;
  const cur=recOf(d,f,k);
  if(cur&&(!before||cur.at!==before.at)&&!confirm(`${cur.by} 在 ${whenLabel(cur.at)} 已經點過這一張了。\n要用你的紀錄取代嗎？（原本那筆會留在修改紀錄裡）`)) return;
  fvs.rec=cur;
  const v={}; f.items.forEach(it=>{ v[it.id]=evalItem(f,it,dr); });
  const bad=Object.values(v).filter(x=>x===0).length;
  const keep=o=>{ const r={}; Object.keys(o||{}).forEach(id=>{ if(v[id]===0||id.startsWith('_')||special(f)) r[id]=o[id]; }); return r; };
  const old=fvs.rec, now=Date.now();
  const rec={by:me(),at:now,dev,fv:fver,v,a:keep(dr.a),n:keep(dr.n),r:keep(dr.r),x:keep(dr.x),bad};
  if(old&&old.by) rec.h=[...(old.h||[]),{by:old.by,at:old.at,bad:old.bad||0}];
  if(old&&old.res&&Object.keys(old.res).length) rec.res=old.res;
  const dd=k==='M'&&old&&old._d?old._d:d;   // 每月一次的改紀錄：寫回原本那一天

  delete drafts[draftKey(d,f,k)]; lsSet(LS.draft,drafts);
  closeForm();
  toast(bad?`已送出，${bad} 項異常`:'已送出 ✓');
}

  if(m==='bad'){ const c={}; S.abn.forEach(a=>{ const key=a.f.name+'｜'+a.it.name; c[key]=(c[key]||0)+1; }); const L=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,10);

// 折線圖（純 SVG）：縱軸分四格，每格取剛好夠大的整齊數字；橘色＝目前看的月份／今天；點太密時只標最後一點、最高點和今天
function lineSvg(pts,curKey,day,unit){
  const n=pts.length; if(!n) return '';
  const isP=unit==='%';
  const nice=m=>{ const raw=m/4, e=Math.pow(10,Math.floor(Math.log10(raw))); return 4*([1,1.25,1.5,2,2.5,3,4,5,6,8,10].map(f=>f*e).find(v=>v>=raw&&Math.abs(v-Math.round(v))<1e-9)||Math.ceil(raw)); };
  const max=Math.max(0,...pts.map(p=>p.v));
  const hi=isP?(max>0?Math.min(100,nice(max))||100:100):(max>0?nice(max):4), lo=0;
  const W=400,H=230,L=46,Rr=22,B=38,T=n>6?40:26, step=n>1?(W-L-Rr)/(n-1):W;
  const x=i=>n===1?L+(W-L-Rr)/2:L+step*i, y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const lab=v=>fmt(v,isP?0:1)+(isP?'%':'');
  let g='';
  for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, yy=y(v); g+=`<line x1="${L}" y1="${yy}" x2="${W-Rr}" y2="${yy}" stroke="#dbe5e8"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="10.5" fill="#667785">${lab(v)}</text>`; }
  for(let i=1;i<n;i++) g+=`<line x1="${x(i-1)}" y1="${y(pts[i-1].v)}" x2="${x(i)}" y2="${y(pts[i].v)}" stroke="#13606e" stroke-width="2.5" stroke-linecap="round"/>`;
  let mx=0; pts.forEach((p,i)=>{ if(p.v>pts[mx].v) mx=i; });
  const boxes=[], labelY=(x0,cy,w)=>{ for(const dy of [-10,-23,21,-36,34]){ const ty=cy+dy, b=[x0-2,ty-10,x0+w+2,ty+3];
      if(ty<11||ty>H-B-3||boxes.some(o=>b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1])) continue; boxes.push(b); return ty; } return cy-10; };
  let lastY=null;
  pts.forEach((p,i)=>{
    const on=p.k===curKey, dense=n>(day?10:12), show=!dense||on||i===n-1||i===mx;
    const [yy,mm]=day?[0,0]:p.k.split('-').map(Number);
    const tick=day?(n<=16||i===0||i===n-1||((i+1)%5===0&&n-1-i>1)?p.k:''):mm+'月';
    const anc=n>1&&i===0?'start':n>1&&i===n-1?'end':'middle', lx=x(i)+(anc==='start'?4:anc==='end'?-4:0), lw=lab(p.v).length*6.4;
    const ly=show?labelY(anc==='start'?lx:anc==='end'?lx-lw:lx-lw/2,y(p.v),lw):0;
    g+=(dense&&!show?'':`<circle cx="${x(i)}" cy="${y(p.v)}" r="${on?5.5:4}" fill="${on?'#f2a541':'#13606e'}" stroke="#fff" stroke-width="1.5"/>`)+
      (show?`<text x="${lx}" y="${ly}" text-anchor="${anc}" font-size="11" font-weight="700" fill="${on?'#a85800':'#0c4651'}" stroke="#fff" stroke-width="3" paint-order="stroke">${lab(p.v)}</text>`:'')+
      (tick!==''?`<text x="${x(i)}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="#1f2d3d">${tick}</text>`:'')+
      (day?(i===0?`<text x="${x(i)}" y="${H-B+30}" text-anchor="middle" font-size="10" fill="#667785">${day}月</text>`:''):(yy!==lastY?`<text x="${x(i)}" y="${H-B+30}" text-anchor="middle" font-size="10" fill="#667785">${yy-1911}年</text>`:''));
    lastY=yy;
  });
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

    write('PATCH',recPath(d,f,ds.k)+'/res',{[ds.id]:{by:nm,at:Date.now(),txt:txt.trim()||'已處理'}});
    if($('mask').classList.contains('on')) showRec(d,ds.f,ds.k); renderManage(); toast('已標記處理'); return; }
  if(a==='stadd'){ const v=($('st-in').value||'').trim(); if(!v) return; const L=[...(getAt('cfg/staff')||[])]; if(!L.includes(v)) L.push(v); write('PUT','cfg/staff',L); renderManage(); return; }
  if(a==='stdel'){ const L=[...(getAt('cfg/staff')||[])]; L.splice(+ds.i,1); write('PUT','cfg/staff',L.length?L:null); renderManage(); return; }
  if(a==='edsel'){ edSel=ds.f; renderManage(); return; }
  if(a==='edmv'){ const f=edF.find(x=>x.id===edSel), i=+ds.i, same=f.items.map((it,ix)=>it.s===f.items[i].s?ix:-1).filter(ix=>ix>=0), p=same.indexOf(i), j=same[p+(+ds.d)];   // 只在同一區裡上下移
    if(j==null) return; [f.items[i],f.items[j]]=[f.items[j],f.items[i]]; edDirty=true; renderManage(); return; }
  if(a==='eddel'){ const f=edF.find(x=>x.id===edSel), it=f.items[+ds.i]; if(f.items.length<2){ toast('至少要留一項'); return; } if(it.name&&!confirm(`刪除「${it.name}」？（按儲存才生效）`)) return; f.items.splice(+ds.i,1); edDirty=true; renderManage(); return; }
  if(a==='edadd'){ const f=edF.find(x=>x.id===edSel), at=+ds.after, ref=f.items[at];
    f.items.splice(at+1,0,{id:f.id+'_'+Date.now().toString(36),s:ref?ref.s:'項目',name:'',q:'',t:f.kind==='narc'?'n':f.kind==='temp'?'temp':'n',sub:''}); edDirty=true; renderManage();
    const el=document.querySelector(`input[data-edi=name][data-i="${at+1}"]`); if(el) el.focus(); return; }
  if(a==='edaddsec'){ const f=edF.find(x=>x.id===edSel), nm=(prompt('新區域的名稱（例如：第五層抽屜）','')||'').trim(); if(!nm) return;
    f.items.push({id:f.id+'_'+Date.now().toString(36),s:nm,name:'',q:'',t:f.kind==='narc'?'n':f.kind==='temp'?'temp':'n',sub:''}); edDirty=true; renderManage(); return; }
  if(a==='edreset'){ const def=DEFAULT_FORMS.find(x=>x.id===edSel); if(!def){ toast('這張沒有原始內容'); return; } if(!confirm('這張點班單恢復成紙本原始內容？（按儲存才生效）')) return;
    const i=edF.findIndex(x=>x.id===edSel); edF[i]=clone(def); edDirty=true; renderManage(); return; }
  if(a==='edcancel'){ edF=null; edDirty=false; renderManage(); return; }
  if(a==='edsave'){ const bad=edF.find(f=>f.items.some(it=>!String(it.name||'').trim())); if(bad){ edSel=bad.id; renderManage(); toast(`「${bad.name}」有項目沒寫名稱`); return; }
    const nq=edF.find(f=>f.items.some(it=>it.t==='n'&&!/^\d+$/.test(String(it.q).trim()))); if(nq){ edSel=nq.id; renderManage(); toast(`「${nq.name}」方式是「數量」的項目，設定量要填數字`); return; }
    edF.forEach(f=>f.items.forEach(it=>{ it.q=String(it.q).trim(); }));
    const nv=fver+1, data=clone(edF);
    write('PUT','cfg/forms',data); write('PUT','cfg/fhist/'+nv,data); write('PUT','cfg/fver',nv);
    applyCfg(); edF=null; edDirty=false; renderManage(); toast('點班單內容已儲存'); return; }
});
function mgrName(){
  let n=me();
  if(!n){ n=(prompt('核簽用的名字','')||'').trim(); if(!n) return ''; lsSet(LS.me,n); }
  return n;
}
document.addEventListener('input',e=>{
  const t=e.target, ds=t.dataset;
  if(ds.in&&fvs&&!fvs.soak){
    const dr=fvs.dr;
    if(ds.in==='n') dr.n[ds.id]=t.value;
    else if(ds.in==='a') dr.a[ds.id]=t.value===''?null:+t.value;
    else if(ds.in==='r') dr.r[ds.id]=t.checked?1:0;
    else if(ds.in==='x'){ const x=dr.x[ds.id]||(dr.x[ds.id]={}); x[ds.fld]=t.type==='checkbox'?(t.checked?1:0):(t.value===''?'':+t.value);
      if(t.type!=='checkbox'){ // 數字改了：只更新狀態那一塊，不重畫輸入框（免得鍵盤收起來）
        const it=fvs.f.items.find(i=>i.id===ds.id), v=evalItem(fvs.f,it,dr), el=$('it-'+ds.id);
        if(el){ el.className='it '+(v===1?'ok':v===0?'ng':''); const ro=el.querySelector('.ro'); if(ro){ ro.className='ro '+(v===1?'ok':v===0?'ng':''); ro.textContent=v===1?'✓':v===0?'⚠':''; }
          const tot=el.querySelector('.tot'); if(tot&&fvs.f.kind==='narc'){ const xx=dr.x[ds.id]; const tt=isNum(xx.u)&&isNum(xx.e)?(+xx.u)+(+xx.e):null;
            tot.innerHTML=`總量 <b>${tt==null?'—':tt}</b> ${it.sub||''}${tt==null?'':v===1?' <span class="tag ok">與設定量相符</span>':` <span class="tag no">設定量 ${esc(it.q)}，不相符</span>`}`; }
          const hasNg=!!el.querySelector('.ngx');
          if((v===0)!==hasNg){ el.outerHTML=itemHtml(fvs.f,it,dr,false); const ne=$('it-'+ds.id), inp=ne&&ne.querySelector(`input[data-fld="${ds.fld}"]`); if(inp){ inp.focus(); const L=inp.value.length; try{ inp.setSelectionRange(L,L); }catch(_){} } } }
        refreshCnt(); saveDraft(); return; } }
    else if(ds.in==='giver') dr.x._giver=t.value;
    else if(ds.in==='face') dr.x._face=t.checked?1:0;
    else if(ds.in==='chg') dr.x._chg=t.checked?1:0;
    else if(ds.in==='sk-other'){ soakForm.other=t.value; return; }
    if(ds.in==='r'||ds.in==='face'||ds.in==='chg'||t.type==='checkbox') { if(ds.in==='r') refreshItem(ds.id); }
    if(ds.in==='n'&&fvs.showMiss) fvs.showMiss=fvs.showMiss.filter(z=>z!==ds.id);
    refreshCnt(); saveDraft(); return;
  }
  if(ds.in==='sk-other'){ soakForm.other=t.value; return; }
  if(ds.in==='sk-qty'){ soakForm.qty=Math.max(1,+t.value||1); return; }
  // 管理頁：點班單內容編輯
  if(ds.ed&&edF){ const f=edF.find(x=>x.id===edSel);
    if(ds.ed==='on') f.on=t.checked?undefined:false;
    else if(ds.ed==='notes') f.notes=t.value.split('\n').map(s=>s.trim()).filter(Boolean);
    else if(ds.ed==='lo'||ds.ed==='hi') f[ds.ed]=t.value===''?undefined:+t.value;
    else f[ds.ed]=t.value;
    if(f.on===undefined) delete f.on;
    markDirty(); return; }
  if(ds.edi&&edF){ const f=edF.find(x=>x.id===edSel), it=f.items[+ds.i]; it[ds.edi]=t.value;
    if(ds.edi==='q'){ const old=(FORMS.find(x=>x.id===f.id)||{items:[]}).items.find(x=>x.id===it.id); t.classList.toggle('chg',!old||String(old.q)!==t.value); }
    markDirty(); return; }
  if(ds.eds!=null&&edF){ const f=edF.find(x=>x.id===edSel); f.items.forEach(it=>{ if(it.s===ds.eds) it.s=t.value; }); t.dataset.eds=t.value; markDirty(); return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pk-date'&&t.value){ setView({d:t.value,s:view.s},false); return; }
  if(t.id==='pr-title'){ const v=t.value.trim(); if(v!==printTitle()){ write('PUT','cfg/printTitle',v||null); toast('表頭已存'); } return; }
  if(t.dataset.ed==='freq'||t.dataset.edi==='t'||t.dataset.ed==='on') renderManage();
});
function markDirty(){ if(!edDirty){ edDirty=true; const b=document.querySelector('[data-act=edsave]'), c=document.querySelector('[data-act=edcancel]'); if(b) b.disabled=false; if(c) c.disabled=false;
  const s=document.querySelector('[data-tg=forms]>summary .r'); if(s) s.innerHTML='<span class="tag w">有未儲存的修改</span>'; } }
// 卡片收合狀態只記在記憶體（每次打開都是收起來的）
document.addEventListener('toggle',e=>{ const t=e.target; if(t.dataset&&t.dataset.tg) mOpen[t.dataset.tg]=t.open; },true);
window.addEventListener('beforeunload',e=>{ if(MANAGE&&edDirty){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'){ if(e.target.id==='who-in') document.querySelector('[data-act="setme-in"]')?.click(); } });

// ---------- 啟動 ----------
applyCfg();
if(MANAGE){
  $('bar').style.display='none';
  manageInit().catch(e=>{ $('main').innerHTML=`<div class="note bad">載入失敗：${esc(e.message)}</div>`; });
  // 回到這一頁時重讀這個月（點班單內容有沒儲存的修改時不重畫，免得改到一半被蓋掉）
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!edDirty) loadMonth(mcur,true); });
} else {
  renderNurse();
  refreshView();
  // 回到 App、每分鐘：重新讀（看別人點了沒）；跟著現在這一班走的話，換班時自動切過去
  const tick=()=>{ if(document.hidden) return; if(followNow&&!fvs){ const c=nowShift(); if(c.d!==view.d||c.s!==view.s){ view=c; renderNurse(); } } refreshView(); };
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tick(); });
  setInterval(tick,60000);
  window.addEventListener('online',()=>flush());
  if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
