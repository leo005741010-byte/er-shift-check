<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* iPhone 防放大（全 App 統一，主任 2026-10-17）：iPhone／iPad 點輸入框不自動放大，兩指放大照常；Android 不加 maximum-scale（會連兩指放大都鎖掉） */
(function(){var m=document.querySelector('meta[name=viewport]');if(m&&(/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))&&m.content.indexOf('maximum-scale')<0)m.content+=',maximum-scale=1';})();</script>
<style>html,body,*{touch-action:manipulation}/* 連點兩下不放大，兩指放大照常 */</style>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#13606e">
<link rel="icon" href="icon-192.png">
<title>衛材點班</title>
<style>
:root{--pri:#13606e;--pri-dark:#0c4651;--bg:#f2f6f7;--card:#fff;--line:#dbe5e8;--txt:#1f2d3d;--mut:#667785;
  --ok:#1f8a4c;--okbg:#e6f5ec;--warn:#a85800;--warnbg:#fff4e0;--bad:#c0392b;--badbg:#fdecea;--yel:#8a6d00;--yelbg:#fff9db}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.55}
button,input,select{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{background:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top .wrap{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
main.wrap{padding-top:12px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
header.top .wrap{display:flex;align-items:center;gap:10px}
.hinfo{margin-left:auto;display:flex;gap:8px}
.hinfo button{font:inherit;font-size:15px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:7px;padding:2px 9px;cursor:pointer;white-space:nowrap}
/* 我是誰（名單、密碼鍵盤：跟急診點班同一套） */
.who h2{font-size:19px;margin:2px 0 8px}
.who .grp{font-size:13.5px;color:var(--mut);margin:12px 0 6px}
.names{display:flex;flex-wrap:wrap;gap:8px}
.names button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:16px;cursor:pointer;color:var(--txt)}
.names button.duty{border-color:var(--pri);color:var(--pri);font-weight:700;background:#eef6f7}
.who .row{display:flex;gap:8px;margin-top:10px}
.who .row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:16px}
.whoc{text-align:center}
.whoc .big{font-size:17px;margin:6px 0 2px}
.whoc .big b{display:block;font-size:26px;color:var(--pri-dark);margin-top:2px}
.whoc .hint{color:var(--mut);font-size:15px;margin-bottom:6px}
.whoc .hint.step{color:var(--pri-dark);font-weight:700}
.pind{display:flex;justify-content:center;gap:16px;margin:10px 0 14px}
.pind i{width:15px;height:15px;border-radius:50%;border:2px solid var(--pri);display:block}
.pind i.on{background:var(--pri)}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:10px;justify-content:center;margin:0 auto 6px}
.pinpad button{height:58px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:26px;color:var(--txt);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pinpad button:active{background:#e6f1f3}
.pinpad button:disabled{opacity:.4}
.autherr{color:var(--bad);font-weight:700;margin:6px 0}
/* 後台（嵌在急診點班管理頁） */
body.mg header.top{display:none}
html:has(body.mg),body.mg{background:transparent}
body.mg main.wrap{max-width:1100px;padding-top:10px}
.mg .tiles{grid-template-columns:repeat(7,1fr)}
@media (max-width:980px){.mg .tiles{grid-template-columns:repeat(4,1fr)}}
@media (max-width:760px){.mg .tiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:420px){.mg .tiles{grid-template-columns:repeat(2,1fr)}}
.mrow{border-top:1px solid #e8eff1;padding:8px 2px}
.mrow:first-child{border-top:none}
.mrow .h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.mrow .h b{font-size:15px}
.mrow .h .r{margin-left:auto;font-size:13.5px}
.mrow .t{font-size:13px;color:var(--mut);margin-top:2px}
.mrow .bs{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;margin-top:3px}
.stk{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.stk span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap}
.wl{display:grid;grid-template-columns:14px 1fr auto auto;gap:6px 10px;align-items:center;font-size:14px}
.wl i{width:12px;height:12px;border-radius:3px;display:block}
.lg{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;font-size:13.5px;align-items:baseline}
.lg .t{color:var(--mut);white-space:nowrap}
.lg .w{font-weight:700;white-space:nowrap}
.mut{color:var(--mut)}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;white-space:nowrap;font-size:15px}
.btn:active{background:var(--pri-dark)}
.btn.outline{background:#fff;color:var(--pri)}
.btn.ghost{background:#fff;color:var(--mut);border-color:var(--line)}
.btn.mini{font-size:13px;padding:3px 10px;border-radius:7px}
.btn.big{font-size:19px;padding:15px 18px;border-radius:14px;width:100%;font-weight:700;letter-spacing:1px}
.btn.wide{width:100%}
.btn.danger{background:#fff;color:var(--bad);border-color:#f1b9b3}
.btn:disabled{opacity:.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:12px}
.scanbox .btn.big{margin-bottom:10px}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
.note{border-radius:9px;padding:9px 13px;font-size:14px;margin-bottom:12px}
.note.warn{background:var(--warnbg);color:var(--warn);border:1px solid #f3d9a4}
/* 數字磚 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;cursor:pointer;text-align:left;color:var(--txt)}
.tile .k{font-size:13.5px;color:var(--mut)}
.tile .v{font-size:30px;font-weight:800;line-height:1.15}
.tile .v small{font-size:14px;font-weight:600;color:var(--mut);margin-left:3px}
.tile.sm .v{font-size:22px}
.tile.bad{background:var(--badbg);border-color:#f1b9b3}.tile.bad .v{color:var(--bad)}
.tile.warn{background:var(--warnbg);border-color:#f3d9a4}.tile.warn .v{color:var(--warn)}
.tile.yel .v{color:var(--yel)}
/* 區域卡片 */
details.sec{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.sec>summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 15px;font-size:16px;font-weight:700;color:var(--pri-dark);list-style:none;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'▸';color:var(--mut);font-size:15px;transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>summary .r{margin-left:auto;font-weight:400;font-size:13px;color:var(--mut)}
details.sec .body{padding:0 15px 10px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:1px 8px;line-height:1.6;white-space:nowrap}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.yel{background:var(--yelbg);color:var(--yel)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.no{background:#eef0f2;color:var(--mut)}
.it{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid #e8eff1;cursor:pointer}
.it:first-child{border-top:none}
.it .nm{flex:1;min-width:0;font-size:14.5px}
.it .ar{font-size:12px;color:var(--mut);margin-top:1px}
.sheet>.lb{font-size:13.5px;color:var(--mut);margin:12px 0 2px}
.it .bc{white-space:nowrap;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
.it .rt{text-align:right;flex-shrink:0;font-size:13px}
.it .qn{font-weight:700;font-size:14px}
.it .qn.low{color:var(--bad)}
.it.s-exp{background:linear-gradient(90deg,var(--badbg),transparent 70%)}
.it.s-d30{background:linear-gradient(90deg,var(--warnbg),transparent 70%)}
.addbtn{margin:2px 0 12px}
.log{font-size:13.5px}
.log div{padding:5px 0;border-top:1px solid #e8eff1}
.log div:first-child{border-top:none}
.log .t{color:var(--mut);margin-right:6px;font-variant-numeric:tabular-nums}
.codes div{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #e8eff1;font-size:13.5px}
.codes div:first-child{border-top:none}
.codes code{font-size:12.5px;color:var(--mut);word-break:break-all}
.codes .n{flex:1;min-width:0}
footer{font-size:12px;color:var(--mut);text-align:center;padding:10px 0 0}
/* 掃描畫面 */
#scan{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#scan.on{display:flex}
#scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scan .frame{position:absolute;left:50%;top:44%;width:min(72vw,320px);height:min(46vw,210px);transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#scan .frame.hit{border-color:#4cd964}
#scan .bar{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;color:#fff}
#scan .bar b{font-size:17px;flex:1}
#scan .sbtn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:8px 14px;font-size:15px}
#scan .bot{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px calc(22px + env(safe-area-inset-bottom))}
#scan .st{color:#fff;font-size:15px;text-align:center;min-height:22px;text-shadow:0 1px 3px #000}
#scan .row{display:flex;gap:10px}
/* 底部彈出視窗 */
.mask{position:fixed;inset:0;background:rgba(10,25,30,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet h2{font-size:18px;margin:0 0 2px;line-height:1.4}
.sheet .sub{font-size:13px;color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet .sub .btn{margin-left:auto}
.sheet .acts{display:flex;gap:10px;margin-top:14px}
.sheet .acts .btn{flex:1;padding:11px 10px;font-size:16px}
.found{border-radius:10px;padding:9px 12px;margin:8px 0 12px;font-size:14.5px;background:#eef6ff;border:1px solid #c9ddf5;color:#1d4f86;word-break:break-all}
.found b{font-weight:700}
.found.match{background:var(--okbg);border-color:#b9e2c8;color:var(--ok)}
.qline{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-size:14.5px}
.qline b{font-size:17px}
.bt{border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.bt.hl{border-color:#5aa0e6;box-shadow:0 0 0 2px #cfe3fa}
.bt.s-exp{background:var(--badbg)}
.bt.s-d30{background:var(--warnbg)}
.bt label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mut);gap:2px;min-width:0}
.bt input[type=date],.bt input[type=text]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;width:100%;min-width:0;color:var(--txt);min-height:38px}
.bt .dt{display:flex;gap:4px;align-items:stretch}
.bt .dt input[type=text]{flex:1;font-variant-numeric:tabular-nums}
.bt .dt input.bad{border-color:var(--bad);background:var(--badbg)}
.bt .cal{position:relative;flex:0 0 38px;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--pri);display:flex;align-items:center;justify-content:center;overflow:hidden}
.bt .cal svg{width:20px;height:20px;pointer-events:none}
.bt .cal input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;min-height:0;font-size:16px;cursor:pointer}
.bt .stp{display:flex;align-items:center;gap:6px}
.bt .stp button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:20px;line-height:1;color:var(--pri)}
.bt .stp input{width:58px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-weight:700;font-size:16px}
.bt .del{grid-column:1/-1;justify-self:end;background:none;border:none;color:var(--mut);font-size:14px;padding:2px 4px}
.bt.ne{grid-template-columns:1fr auto}
.bt.ne .del{grid-column:auto}
.chk{display:flex;align-items:center;gap:8px;font-size:14.5px;margin:10px 0 4px}
.chk input{width:20px;height:20px}
.blist .grp{font-size:13px;font-weight:700;color:var(--pri-dark);margin:12px 0 2px}
.search{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:6px 0 4px}
.cbound{font-size:13px;color:var(--mut);margin-top:12px}
.cbound div{display:flex;align-items:center;gap:8px;padding:3px 0}
.cbound code{flex:1;min-width:0;word-break:break-all}
/* 新增／編輯品項 */
.fm .lb{font-size:13.5px;color:var(--mut);margin:12px 0 4px}
.fm input.tx{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;min-height:42px}
.fm .row{display:flex;gap:8px}
.fm .row input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#e8f0f2;border:1px solid var(--line);border-radius:20px;padding:3px 6px 3px 11px;font-size:14px}
.chip button{border:none;background:none;color:var(--mut);font-size:15px;padding:0 4px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font-size:14px;color:var(--txt)}
.pick.on{background:var(--pri);border-color:var(--pri);color:#fff}
/* 確認框、提示 */
.dlg{background:#fff;width:calc(100% - 32px);max-width:420px;border-radius:14px;padding:18px 18px 14px;margin:auto}
.mask.center{align-items:center}
.dlg .msg{font-size:15.5px;line-height:1.6;word-break:break-word}
.dlg .msg b{color:var(--pri-dark)}
.dlg .acts{display:flex;gap:10px;margin-top:16px}
.dlg .acts .btn{flex:1;padding:10px}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;border-radius:22px;padding:9px 18px;font-size:14.5px;z-index:90;display:none;max-width:calc(100% - 40px);text-align:center}
/* 從急診點班首頁點進來（嵌在點班裡）：頁首用點班的 */
body.emb header.top{display:none}
.it .bc.hv{color:#8a5a00;border-color:#ecd39a;background:#fff8e6}
/* 高貴衛材使用登記 */
.card .ch{display:flex;align-items:center;font-weight:700;color:var(--pri-dark);margin-bottom:4px}
.card .ch .r{margin-left:auto;font-weight:400;font-size:13px;color:var(--mut)}
.urow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid #e8eff1}
.urow:first-child{border-top:none}
.urow .w{flex:1;min-width:0}
.urow .w b{font-size:15px}
.urow small{display:block;font-size:13px;color:var(--mut);line-height:1.5}
.urow small b{color:var(--txt);font-size:13.5px}
.urow .tag{margin-left:6px}
.pt3{display:flex;gap:8px;align-items:center}
.fm input.p3{width:120px;flex:0 0 auto;font-size:22px;font-weight:700;letter-spacing:8px;text-align:center;font-variant-numeric:tabular-nums}
.stp1{display:flex;align-items:center;gap:14px}
.stp1 button{width:44px;height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:22px;color:var(--pri)}
.stp1 b{font-size:20px;min-width:24px;text-align:center}
.big+.card{margin-top:12px}
/* 後台設定 */
.hvl .grp{font-size:13px;font-weight:700;color:var(--pri-dark);margin:12px 0 4px}
.hvl label{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:14.5px;cursor:pointer}
.hvl label input{width:19px;height:19px;flex:0 0 auto}
.hvl label.chg{color:#a85800;font-weight:700}
.sact{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.trend{width:100%;height:auto;display:block;margin:2px 0 8px}
.mrow .h .r b{font-size:15px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1 id="ttl">衛材點班</h1><div class="hinfo" id="hinfo"></div></div></header>
<main class="wrap" id="app"></main>

<div id="scan">
  <video id="vid" playsinline muted autoplay></video>
  <div class="frame" id="frame"></div>
  <div class="bar"><b>掃描條碼／QR Code</b><button class="sbtn" id="torch" style="display:none">手電筒</button><button class="sbtn" data-act="scanClose">關閉</button></div>
  <div class="bot">
    <div class="st" id="scanSt"></div>
    <div class="row"><button class="sbtn" data-act="photo">拍照掃描</button></div>
  </div>
</div>
<input type="file" id="photo" accept="image/*" capture="environment" style="display:none">
<div id="sheetHost"></div>
<div id="dlgHost"></div>
<div id="toast"></div>

<script>
'use strict';
/* 衛材點班（2026-11-09 v0.7.0 起併入急診點班，原 er-crash-cart 衛材管理）
   從點班首頁「登錄」點進來（嵌在點班裡，不用再輸入密碼）：
     supplies.html?m=inv&me=名字  衛材點班（效期、數量）：只有管理頁勾了權限的人（erShiftCheckData/cfg/supAcc）
     supplies.html?m=use&me=名字  高貴衛材使用登記：每位護理師
     supplies.html?mg=1           後台：嵌在管理頁「衛材管理」那一頁                                          */
// 本機測試保護：直接開檔案、或在點班的假雲端測試頁裡卻沒有假雲端 → 不連正式資料庫
(function(){ let bad=location.protocol==='file:';
  try{ if(window.parent!==window&&window.parent.__mockLog&&!window.__mockLog) bad=true; }catch(e){}
  if(bad){ document.addEventListener('DOMContentLoaded',()=>{ document.body.textContent='請從急診點班打開'; }); throw new Error('stop'); } })();
const VERSION='0.7.1';

let _tok=null,_tokExp=0,_tokP=null;
async function idToken(force){
  if(!force&&_tok&&Date.now()<_tokExp) return _tok;
  if(_tokP&&!force) return _tokP;
  _tokP=(async()=>{
    const keep=d=>{ _tok=d.idToken||d.id_token; _tokExp=Date.now()+(Number(d.expiresIn||d.expires_in||3600)-60)*1000;
      const rt=d.refreshToken||d.refresh_token; if(rt) lsSet(LS.rt,rt); return _tok; };
    const rt=lsGet(LS.rt,null);
    if(rt){ const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_API_KEY}`,{method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)});
      if(r.ok) return keep(await r.json()); }
    const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB_API_KEY}`,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
    if(!r.ok) throw new Error('雲端登入失敗（HTTP '+r.status+'）');
    return keep(await r.json());
  })();
  try{ return await _tokP; } finally{ _tokP=null; }
}
async function fb(method,path,body,q,base){
  for(let i=0;;i++){
    const ac=new AbortController(), tm=setTimeout(()=>ac.abort(),12000);
    let r;
    try{ r=await fetch(`${FB_DB}/${base||NODE}${path?'/'+path.split('/').map(encodeURIComponent).join('/'):''}.json?auth=${encodeURIComponent(await idToken(i>0))}${q||''}`,
      {method,cache:'no-store',signal:ac.signal,body:body===undefined?undefined:JSON.stringify(body)}); }
    finally{ clearTimeout(tm); }
    if(r.ok) return r.json();
    const msg=await r.text().catch(()=>'');
    if((r.status===401||r.status===403)&&i===0&&/expired|invalid|token/i.test(msg)) continue;   // 憑證過期：重拿一次
    if(r.status===401||r.status===403) throw Object.assign(new Error('雲端規則尚未開放'),{kind:'denied'});
    throw new Error('雲端回應 HTTP '+r.status);
  }
}
// 這支手機上的雲端副本＋還沒上傳成功的寫入（沒網路、雲端還沒開通都能用，連上後自動補傳）
let db=lsGet(LS.cache,{});
let outbox=lsGet(LS.out,[]);
const cloud={st:'idle',at:0};
const getAt=path=>path.split('/').reduce((o,k)=>o&&typeof o==='object'?o[k]:undefined,db);
function setAt(path,val){
  const ks=path.split('/'); let o=db;
  for(let i=0;i<ks.length-1;i++){ if(!o[ks[i]]||typeof o[ks[i]]!=='object') o[ks[i]]={}; o=o[ks[i]]; }
  if(val==null) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]]=val;
}
const encKey=k=>String(k).replace(/[%.#$\[\]\/\x00-\x1f\x7f]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0'));
async function pull(path,q){
  try{
    const v=await fb('GET',path,undefined,q);
    setAt(path,v);
    outbox.forEach(o=>{ if(o.p===path||o.p.startsWith(path+'/')) setAt(o.p,o.b); });   // 還沒傳上去的，蓋回本機副本
    cloud.st='ok'; cloud.at=Date.now(); lsSet(LS.cache,db);
    return true;
  }catch(e){ cloud.st=e.kind==='denied'?'denied':'off'; return false; }
}
function write(path,body){
  if(MANAGE) return;
  setAt(path,body);
  outbox=outbox.filter(o=>o.p!==path);   // 同一個位置改了又改只留最後一筆
  outbox.push({p:path,b:body==null?null:body,t:Date.now()}); lsSet(LS.out,outbox); lsSet(LS.cache,db);
  derive();
}
let _flushing=false;
async function flush(fromWrite){
  if(_flushing||!outbox.length) return; _flushing=true;
  try{
    while(outbox.length){ const o=outbox[0]; await fb(o.b==null?'DELETE':'PUT',o.p,o.b==null?undefined:o.b); outbox.shift(); lsSet(LS.out,outbox); }
    cloud.st='ok'; cloud.at=Date.now();
  }catch(e){
    cloud.st=e.kind==='denied'?'denied':'off';
    if(fromWrite) toast(cloud.st==='denied'?'雲端還沒開通，先存在這支手機':'沒有網路，先存在這支手機，連上後自動上傳');
  }finally{ _flushing=false; if(!typing()) render(); }
}
async function pullAll(){

    ...(MANAGE?[pull('use'),pull('udel')]:[pull('use/'+mk),pull('use/'+pm)])]);
  if(r.slice(0,5).every(Boolean)) migrateOld();
  derive();
  if(outbox.length) await flush(); else if(!typing()) render();
}

  if('ne' in v){ if(v.ne) o.ne=1; else delete o.ne; }
  if(v.hide) o.hide=1; else delete o.hide;

  if(v.at) o.at=v.at;

}
function derive(){
  const ne=db.ne||{}, ci=db.items||{};
  const list=DEF_ITEMS.map(x=>{
    const o=Object.assign({},x); delete o.p;
    if(ne[x.id]===true) o.ne=1; else if(ne[x.id]===false) delete o.ne;
    // 從舊的「各N」拆出來的：自己還沒改過，就沿用舊那一項改過的位置／不用管效期／移除
    if(x.p&&!ci[x.id]){
      const pv=ci[x.p];
      if(ne[x.p]===true) o.ne=1;
      if(pv&&typeof pv==='object'){ if(pv.s) o.s=pv.s; if(pv.ne) o.ne=1; if(pv.hide) o.hide=1; }
    }
    return applyOv(o,ci[x.id]);
  });
  const cus=Object.keys(ci).filter(id=>!DEF_ITEMS.some(d=>d.id===id)&&!SPLIT_FROM[id]&&ci[id]&&ci[id].name).map(id=>applyOv({id},ci[id]));
  cus.sort((a,b)=>natCmp(a.name,b.name)||natCmp(a.sz,b.sz)||(a.at||0)-(b.at||0));
  DB.all=list.concat(cus);
  const hvm=db.hv||{}; DB.all.forEach(o=>{ if(hvm[o.id]) o.hv=1; else delete o.hv; });
  DB.items=DB.all.filter(i=>!i.hide);
  const flat=node=>{ const a=[]; Object.keys(node||{}).forEach(mk=>{ const M=node[mk]; if(M&&typeof M==='object') Object.keys(M).forEach(id=>{ const x=M[id]; if(x&&x.at&&x.i) a.push(Object.assign({},x,{id,mk,tk:toArr(x.tk),n:+x.n||1})); }); }); return a; };
  DB.use=flat(db.use); DB.udel=flat(db.udel);
  DB.codes={}; Object.keys(db.codes||{}).forEach(k=>{ const c=db.codes[k]; if(c&&c.k&&c.i) DB.codes[c.k]=c.i; });
  DB.stock={}; DB.smeta={}; Object.keys(db.stock||{}).forEach(id=>{ const s=db.stock[id]; if(s){ DB.stock[id]=toArr(s.r).map(r=>({m:r.m||'',e:r.e||'',l:r.l||'',n:+r.n||0})); DB.smeta[id]={at:s.at||0,by:s.by||''}; } });
  DB.log=Object.keys(db.log||{}).map(k=>db.log[k]).filter(x=>x&&x.t).sort((a,b)=>b.t-a.t);
  const bid=new Set(Object.keys(DB.codes).map(k=>DB.codes[k]));
  DB.coded=new Set(DB.items.filter(i=>bid.has(i.id)).map(normL));
}

const b64u={enc:b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),

async function pinHash(pin,s,i){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);

function pinFail(ok){ if(ok){ try{ localStorage.removeItem(PIN_LS); }catch(e){} return; } const F=lsGet(PIN_LS,null)||{c:0}; if(F.c>=PIN_MAX) F.c=0; F.c++; F.t=Date.now(); lsSet(PIN_LS,F); }

async function pinKey(k){
  if(authUI.busy||pinLocked()) return;
  if(k==='⌫'){ authUI.buf=authUI.buf.slice(0,-1); render(); return; }
  if(authUI.buf.length>=4) return;
  authUI.buf+=k; authUI.err=''; render();
  if(authUI.buf.length<4) return;
  const n=authUI.n, pin=authUI.buf;
  if(authUI.m==='pin1'){ authUI.p1=pin; authUI.buf=''; authUI.m='pin2'; setTimeout(render,150); return; }
  if(authUI.m==='pin2'){
    if(pin!==authUI.p1){ Object.assign(authUI,{m:'pin1',p1:'',buf:'',err:'兩次輸入的不一樣，請重新設定'}); setTimeout(render,150); return; }
    authUI.busy=true; render();
    const s=b64u.enc(crypto.getRandomValues(new Uint8Array(16))), P={s,h:await pinHash(pin,s,PIN_ITER),i:PIN_ITER};
    try{ await fb('PATCH','auth/'+authKey(n),{n,pin:P,at:Date.now(),dev:DEV,reset:null},'',STAFF_NODE); }   // 跟點班同一份：點班也用這個密碼

  authUI.busy=true; render();

  if(lk) setTimeout(()=>{ if(!ME) render(); },lk*1e3+200);
}

/* ---------- 效期狀態 ---------- */
function qNum(q){ return /^\d+$/.test(String(q||'').trim())?+q:null; }
function stat(it){
  const rows=(DB.stock[it.id]||[]).filter(r=>r.n>0);
  const set=DB.stock[it.id]!==undefined;
  const total=rows.reduce((a,r)=>a+r.n,0);
  let first='';
  if(!it.ne) rows.forEach(r=>{ if(isD(r.e)&&(!first||r.e<first)) first=r.e; });
  const dd=first?daysTo(first):null;
  let s='';
  if(!it.ne){
    if(first&&dd<0) s='exp'; else if(first&&dd<=30) s='d30'; else if(first&&dd<=90) s='d90';
  }
  const noExp=!it.ne&&(!rows.length||rows.some(r=>!isD(r.e)));
  const qn=qNum(it.q);
  const low=set&&qn!=null&&total<qn;
  return {rows,set,total,first,dd,s,noExp,low};
}
function expTag(st){
  if(!st.first) return '';
  if(st.s==='exp') return '<span class="tag bad">'+fmtD(st.first)+' 已過期</span>';
  if(st.s==='d30') return '<span class="tag warn">'+fmtD(st.first)+'・剩 '+st.dd+' 天</span>';
  if(st.s==='d90') return '<span class="tag yel">'+fmtD(st.first)+'</span>';
  return '<span class="tag ok">'+fmtD(st.first)+'</span>';
}

// 逐月折線（高貴衛材使用筆數）：縱軸上限貼著資料、看的那個月橘色
function trendSvg(P,cur){
  const W=640,H=170,l=34,r=16,t=18,b=26,n=P.length,mx=Math.max(1,...P.map(p=>p.v)),G=Math.min(4,mx),step=Math.ceil(mx/G),top=step*G;
  const x=i=>n<2?(l+(W-l-r)/2):l+i*(W-l-r)/(n-1), y=v=>t+(H-t-b)*(1-v/top);
  const hi=P.reduce((a,p,i)=>p.v>P[a].v?i:a,0), lab=new Set(n<=12?P.map((p,i)=>i):[n-1,hi,P.findIndex(p=>p.k===cur)]);
  let s='<svg class="trend" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="逐月使用筆數">';
  for(let g=0;g<=G;g++){ const yy=y(step*g); s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+(g?'#e3eaec':'#b9c7cc')+'"/><text x="'+(l-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#667785">'+step*g+'</text>'; }
  if(n>1) s+='<polyline fill="none" stroke="#13606e" stroke-width="2.2" points="'+P.map((p,i)=>x(i).toFixed(1)+','+y(p.v).toFixed(1)).join(' ')+'"/>';
  P.forEach((p,i)=>{ const on=p.k===cur;
    if(n<=12||lab.has(i)) s+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(on?5:3.5)+'" fill="'+(on?'#e07b00':'#13606e')+'"/>';
    if(lab.has(i)) s+='<text x="'+x(i).toFixed(1)+'" y="'+(y(p.v)-9).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="700" fill="'+(on?'#e07b00':'#1f2d3d')+'">'+p.v+'</text>';
    if(n<=12||!(i%Math.ceil(n/12))||i===n-1) s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="11" fill="#667785">'+(+p.k.slice(5))+'月</text>'; });
  return s+'</svg>';
}
function useCard(){
  const U=DB.use.filter(x=>x.mk===MK).sort((a,b)=>b.d.localeCompare(a.d)||b.at-a.at), C=DB.udel.filter(x=>x.mk===MK).sort((a,b)=>b.at-a.at);
  const now=todayStr().slice(0,7), ks=DB.use.map(x=>x.mk).concat([now,MK]).sort(), P=[];
  for(let k=ks[0];k<=now;k=(()=>{ const y=+k.slice(0,4), m=+k.slice(5); return m===12?(y+1)+'-01':y+'-'+pad(m+1); })()) P.push({k,v:DB.use.filter(x=>x.mk===k).length});
  let b=trendSvg(P,MK);
  // 各品項：分色橫條＋清單（由多到少）

const CAL_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>';
function dateBox(lab,f,r,i){
  const txt=r[f+'T']!=null?r[f+'T']:fmtD(r[f]);
  return '<label>'+lab+'<div class="dt"><input type="text" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="年/月/日" data-f="'+f+'" data-i="'+i+'" value="'+esc(txt)+'"'+(r[f+'X']?' class="bad"':'')+'>'+
    '<span class="cal">'+CAL_SVG+'<input type="date" tabindex="-1" aria-label="'+lab+'日曆" data-cal="'+f+'" data-i="'+i+'" value="'+esc(isD(r[f])?r[f]:'')+'"></span></div></label>';
}
const rocY=y=>{ y=+y; return y>=100&&y<200?y+1911:y; };   // 民國年
// 打的字 → 'YYYY-MM-DD'；空白 → ''；看不懂 → null
function parseDateIn(v){
  const s=String(v||'').trim(); if(!s) return '';
  let p=s.split(/[^0-9]+/).filter(Boolean);
  if(p.length===1){
    const d=p[0], yl=(d[0]==='1'&&d[1]!=='9')?3:4;
    if(d.length===yl+4) p=[d.slice(0,yl),d.slice(yl,yl+2),d.slice(yl+2)];
    else if(d.length===yl+2) p=[d.slice(0,yl),d.slice(yl)];
    else return null;
  }
  if(p.length<2||p.length>3) return null;
  if(p[1].length===1&&p.length===2||p.length===3&&(+p[2]===0||p[1].length===2&&p[2].length===1)) return null;   // 沒打完（20251、2028050）不要猜成月底
  return ymdOk(rocY(p[0]),p[1],p[2])||null;
}
// 只打數字時自動補「/」：西元 2027/03/11、民國 116/03/11；自己打了別的分隔就不動
function maskDate(v){
  if(/[^0-9\/]/.test(v)) return v;
  const d=v.replace(/\//g,''), yl=(d[0]==='1'&&d[1]&&d[1]!=='9')?3:4;
  for(let k=0;k<v.length;k++) if(v[k]==='/'&&k!==yl&&k!==yl+3) return v;
  const x=d.slice(0,yl+4);
  let o=x.length<=yl?x:x.length<=yl+2?x.slice(0,yl)+'/'+x.slice(yl):x.slice(0,yl)+'/'+x.slice(yl,yl+2)+'/'+x.slice(yl+2);
  if(v.endsWith('/')&&(x.length===yl||x.length===yl+2)) o+='/';
  return o;
}
// 不整個重畫（不然手機鍵盤會收起來）：只改這一個效期的底色

  else { r[f]=p; delete r[f+'T']; delete r[f+'X']; t.value=fmtD(p); t.classList.remove('bad'); const c=t.parentNode.querySelector('[data-cal]'); if(c) c.value=p; }

  // 不用管效期：只有數量；舊資料有好幾格才留「移除」，只有一格就用 − 改成 0
  if(ne) return '<div class="'+cls+'">'+stp+(nRows>1?'<button class="del" data-act="delRow" data-i="'+i+'">移除</button>':'')+'</div>';

    if(bad){ drawItem(); toast('有日期看不懂，請改成 2027/03/11 這樣'); return; }
  }
  const rows=ED.rows.map(r=>({m:ne?'':(r.m||''),e:ne?'':(r.e||''),l:ne?'':String(r.l||'').trim(),n:Math.max(0,parseInt(r.n,10)||0)})).filter(r=>r.n>0);

  if(!ne&&rows.some(r=>r.m&&r.e&&r.m>r.e)){ toast('製造日期不能晚於效期'); return; }
  rows.sort((a,b)=>(a.e||'9')<(b.e||'9')?-1:(a.e||'9')>(b.e||'9')?1:0);
  const txt=sumTxt(rows,ne);
  if(!await ask('儲存「<b>'+esc(lbl(it))+'</b>」<br>'+esc(txt),'儲存')) return;
  // 打開之後別台手機也改了這一項：先問要不要蓋過去
  await pull('stock/'+ED.id);
  const cur=getAt('stock/'+ED.id);
  if(cur&&(cur.at||0)!==ED.base&&cur.dev!==DEV){
    derive();
    const n=(DB.stock[ED.id]||[]).reduce((a,r)=>a+r.n,0);
    if(!await ask((cur.by?'<b>'+esc(cur.by)+'</b> ':'別台手機')+'在 <b>'+fmtT(cur.at)+'</b> 改過這一項（現在共 '+n+'）。<br>要用你這次的內容<b>蓋過去</b>嗎？','蓋過去','先看最新的')){
      const sc=ED.scan, id=ED.id; ED=null; openItem(id,sc); return;
    }
  }
  write('stock/'+ED.id,{r:rows,at:Date.now(),dev:DEV,by:ME});
  addLog(ED.id,'儲存：'+txt);
  toast('已儲存'); closeSheet(); flush(true);
}

/* ---------- 條碼解析 ----------
   GS1（一維 GS1-128、DataMatrix、QR Code、GS1 Digital Link 網址）：01 商品碼、11 製造日期、17 效期、10 批號、21 序號
   HIBC（＋開頭）：$$ 後面的效期、/14D 效期、/16D 製造日期
   一般文字 QR Code：「製造日期／效期／批號」字樣後面的日期                                                     */
const AI_FIX={'00':18,'01':14,'02':14,'11':6,'12':6,'13':6,'15':6,'16':6,'17':6,'20':2};
const AI_VAR2={'10':1,'21':1,'22':1,'30':1,'37':1,'90':1,'91':1,'92':1,'93':1,'94':1,'95':1,'96':1,'97':1,'98':1,'99':1};
function parseGS1(s){
  s=String(s||'').replace(/^\][A-Za-z]\d/,'').replace(/<GS>|\{GS\}|\[GS\]/gi,'\x1d').trim();
  const o={};
  if(/^\(\d{2,4}\)/.test(s)){
    const re=/\((\d{2,4})\)([^(]*)/g; let m;
    while((m=re.exec(s))) o[m[1]]=m[2].replace(/\x1d/g,'').trim();
    return o;
  }
  s=s.replace(/^\x1d+/,'');
  let i=0, g=0;
  while(i<s.length&&g++<30){
    const a2=s.substr(i,2), a3=s.substr(i,3), a4=s.substr(i,4);
    if(AI_FIX[a2]){ o[a2]=s.substr(i+2,AI_FIX[a2]); i+=2+AI_FIX[a2]; }
    else if(AI_VAR2[a2]){ let j=s.indexOf('\x1d',i+2); if(j<0) j=s.length; o[a2]=s.slice(i+2,j); i=j; }
    else if(/^(24[0-3]|25[0-4]|71[0-9])$/.test(a3)){ let j=s.indexOf('\x1d',i+3); if(j<0) j=s.length; o[a3]=s.slice(i+3,j); i=j; }
    else if(a4==='7003'){ o[a4]=s.substr(i+4,10); i+=14; }
    else break;
    while(s[i]==='\x1d') i++;
  }
  // 沒有分隔字元時，批號／序號可能把後面的日期吃進去（…10ABC12317271231）
  ['10','21'].forEach(k=>{ let m;
    while(o[k]&&(m=o[k].match(/^(.+?)(1[17])(\d{6})$/))&&!o[m[2]]&&gs1Date(m[3])){ o[k]=m[1]; o[m[2]]=m[3]; } });
  return o;
}
// GS1 Digital Link：https://…/01/04712345678900/10/ABC?17=271231&11=250101
function parseDL(s){
  if(!/^https?:\/\//i.test(s)) return null;
  let u; try{ u=new URL(s); }catch(e){ return null; }
  const seg=u.pathname.split('/').filter(Boolean).map(x=>{ try{ return decodeURIComponent(x); }catch(e){ return x; } });
  const o={};
  for(let i=0;i<seg.length-1;i++){
    if(/^(01|gtin)$/i.test(seg[i])&&/^\d{8,14}$/.test(seg[i+1])){
      o['01']=seg[i+1].padStart(14,'0');
      for(let j=i+2;j<seg.length-1;j+=2) if(/^\d{2,4}$/.test(seg[j])) o[seg[j]]=seg[j+1];
      break;
    }
  }
  if(!o['01']) return null;
  u.searchParams.forEach((v,k)=>{ if(/^\d{2,4}$/.test(k)) o[k]=v; });
  return o;
}
function gs1Date(v){
  if(!/^\d{6}$/.test(v||'')) return '';
  const y=2000+(+v.slice(0,2)), m=+v.slice(2,4); let d=+v.slice(4,6);
  if(m<1||m>12) return '';
  const last=new Date(y,m,0).getDate();
  if(d===0) d=last;                         // 日＝00 代表那個月最後一天
  if(d>last) return '';
  return y+'-'+pad(m)+'-'+pad(d);
}
function ymdOk(y,m,d){
  y=+y; m=+m; d=d==null||d===''?0:+d;
  if(y<100) y+=2000;
  if(y<1990||y>2099||m<1||m>12) return '';
  const last=new Date(y,m,0).getDate();
  if(!d) d=last; if(d>last) return '';
  return y+'-'+pad(m)+'-'+pad(d);
}
function parseHIBC(s){
  if(!/^\+[A-Z$]/i.test(s)) return null;
  const o={};
  const sec=s.match(/\$\$(.*)$/);
  if(sec){
    let t=sec[1];
    if(/^[89]/.test(t)) t=t.slice(t[0]==='8'?3:6);   // 8＋2 碼數量、9＋5 碼數量
    let m;
    if((m=t.match(/^([01]\d)(\d\d)(.*)$/))) { o.exp=ymdOk(m[2],m[1]); o.lot=m[3]; }
    else if((m=t.match(/^2(\d\d)(\d\d)(\d\d)(.*)$/))) { o.exp=ymdOk(m[3],m[1],m[2]); o.lot=m[4]; }
    else if((m=t.match(/^3(\d\d)(\d\d)(\d\d)(.*)$/))) { o.exp=ymdOk(m[1],m[2],m[3]); o.lot=m[4]; }
    else if((m=t.match(/^4(\d\d)(\d\d)(\d\d)\d\d(.*)$/))) { o.exp=ymdOk(m[1],m[2],m[3]); o.lot=m[4]; }
    else if((m=t.match(/^7(.*)$/))) { o.lot=m[1]; }
    if(o.lot!=null) o.lot=o.lot.split('/')[0].replace(/.$/,'');   // 最後一個字是檢查碼
  }
  let m;
  if((m=s.match(/\/14D(\d{4})(\d\d)(\d\d)/))) o.exp=ymdOk(m[1],m[2],m[3]);
  if((m=s.match(/\/16D(\d{4})(\d\d)(\d\d)/))) o.mfg=ymdOk(m[1],m[2],m[3]);
  const pri=s.split('/')[0];
  o.key=pri[1]==='$'?s:pri;
  return o;
}
function parseText(s){
  const o={}; let m, rest=s;
  const D='(\\d{4}|\\d{2})\\s*[.\\/\\-年]\\s*(\\d{1,2})(?:\\s*[.\\/\\-月]\\s*(\\d{1,2}))?日?';
  if((m=s.match(new RegExp('(?:製造日期|製造|生產日期|MFG|MFD|Mfg\\.?\\s*Date)[^\\d]{0,6}'+D,'i')))){ o.mfg=ymdOk(m[1],m[2],m[3]); rest=rest.replace(m[0],' '); }
  if((m=s.match(new RegExp('(?:有效日期|有效期限|效期|保存期限|到期日|使用期限|EXP|Expiry|Exp\\.?\\s*Date|Use\\s*by)[^\\d]{0,6}'+D,'i')))){ o.exp=ymdOk(m[1],m[2],m[3]); rest=rest.replace(m[0],' '); }
  if((m=s.match(/(?:批號|LOT|Lot\s*No\.?)[\s:：#]*([A-Za-z0-9\-]+)/i))){ o.lot=m[1]; rest=rest.replace(m[0],' '); }
  if(!o.mfg&&!o.exp) return null;
  o.key=rest.replace(/[\s,，;；]+/g,' ').trim();   // 去掉日期和批號，同一種東西不同批才會對到同一項
  return o;
}
function gtinOk(g){
  if(!/^\d{14}$/.test(g)) return false;
  let s=0; for(let i=0;i<13;i++) s+=(+g[i])*(i%2?1:3);
  return (10-s%10)%10===+g[13];
}
function parseCode(raw,fmt){
  const s=String(raw||'').replace(/[\r\n]+/g,' ').trim();
  const p={raw:s,fmt:fmt||'',gtin:'',mfg:'',exp:'',lot:'',key:''};
  const g=parseDL(s)||parseGS1(s);
  if(g['01']&&/^\d{14}$/.test(g['01'])&&(gtinOk(g['01'])||/^\(|^\]|\x1d|^https?:/i.test(s))){
    p.gs1=1; p.gtin=g['01']; p.lot=(g['10']||'').trim();
    p.exp=gs1Date(g['17']||(g['7003']||'').slice(0,6)); p.mfg=gs1Date(g['11']||'');
  } else if(/^(\d{8}|\d{12,14})$/.test(s)){
    p.gtin=s.padStart(14,'0');   // EAN-13／UPC／EAN-8 補成 14 碼，和 2D 條碼裡的商品碼一致
  } else {
    const h=parseHIBC(s);
    if(h){ p.hibc=1; p.key=h.key; p.exp=h.exp||''; p.mfg=h.mfg||''; p.lot=h.lot||''; }
    else { const t=parseText(s); if(t){ p.exp=t.exp||''; p.mfg=t.mfg||''; p.lot=t.lot||''; if(t.key) p.key=t.key; } }
  }
  p.key=p.gtin||p.key||s;
  return p;
}

/* ---------- 相機掃描 ---------- */
const FORMATS=['data_matrix','qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','databar','databar_expanded'];
let detector=null, stream=null, scanning=false, cand=null, candAt=0, actx=null, torchOn=false;
function loadScript(src){
  return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>no(new Error('load')); document.head.appendChild(s); });
}
async function getDetector(){
  if(detector) return detector;
  if('BarcodeDetector' in window){
    try{
      const sup=await window.BarcodeDetector.getSupportedFormats();
      if(sup.indexOf('data_matrix')>=0&&sup.indexOf('ean_13')>=0&&sup.indexOf('qr_code')>=0){ detector=new window.BarcodeDetector({formats:FORMATS.filter(f=>sup.indexOf(f)>=0)}); return detector; }
    }catch(e){}
  }
  if(!window.BarcodeDetectionAPI) await loadScript(LIB_URL);
  const API=window.BarcodeDetectionAPI;
  try{ await API.prepareZXingModule({fireImmediately:true}); }catch(e){}
  detector=new API.BarcodeDetector({formats:FORMATS});
  return detector;
}
function unlockAudio(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(){
  try{ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=1600; g.gain.value=.18; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.12); }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate(70); }catch(e){}
}
function scanSt(t){ $('#scanSt').textContent=t||''; }
let scanMode='';   // ''＝衛材條碼；'pt'＝病人手圈（只取最後 3 碼）；'pk'＝登記使用時掃包裝
async function openScan(){
  unlockAudio();
  cand=null; torchOn=false;
  $('#scan .bar b').textContent=scanMode==='pt'?'掃病人手圈':'掃描條碼／QR Code';
  $('#scan').classList.add('on'); $('#frame').classList.remove('hit'); $('#torch').style.display='none';
  scanSt('開啟相機…');
  const detP=getDetector().catch(e=>null);
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('nocam');
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
  }catch(e){
    scanSt(e&&e.name==='NotAllowedError'?'相機權限被拒絕，可改用「拍照掃描」':'相機打不開，可改用「拍照掃描」');
    return;
  }
  if(!$('#scan').classList.contains('on')){ stopStream(); return; }
  const v=$('#vid'); v.srcObject=stream;
  try{ await v.play(); }catch(e){}
  try{
    const tr=stream.getVideoTracks()[0], caps=tr.getCapabilities?tr.getCapabilities():{};
    if(caps.torch) $('#torch').style.display='';
    if(caps.focusMode&&caps.focusMode.indexOf('continuous')>=0) tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
  }catch(e){}
  scanSt('載入掃描程式…');
  const det=await detP;
  if(!det){ scanSt('掃描程式載入失敗（網路？）'); return; }
  if(!$('#scan').classList.contains('on')) return;
  scanSt('');
  scanning=true; tick();
}
async function tick(){
  if(!scanning) return;
  const v=$('#vid');
  if(v.readyState>=2&&v.videoWidth){
    try{ onDetect(await detector.detect(v)); }catch(e){}
  }
  if(scanning) setTimeout(tick,110);
}
const hasDate=p=>!!(p&&(p.exp||p.mfg));
function pickBest(list){
  const ps=(list||[]).map(d=>parseCode(d.rawValue,d.format)).filter(p=>p.key);
  return ps.find(hasDate)||ps.find(p=>p.gs1)||ps[0];
}
function onDetect(list){
  const now=Date.now();
  if(scanMode==='pt'){   // 手圈：讀到有數字的條碼就好
    const d=(list||[]).find(x=>/\d{3}/.test(String(x.rawValue||'').replace(/\D/g,'')));
    if(d) accept(parseCode(d.rawValue,d.format));
    return;
  }
  if(list&&list.length){
    const best=pickBest(list);
    if(best){
      $('#frame').classList.add('hit');
      if(hasDate(best)){ accept(best); return; }
      // 一個包裝常同時有一維條碼和 2D 條碼：再等一下，看能不能讀到有日期的那個
      if(!cand||(!cand.gs1&&best.gs1)){ cand=best; if(!candAt) candAt=now; }
    }
  }
  if(cand&&now-candAt>800) accept(cand);
}
function accept(p){
  const m=scanMode;
  scanning=false; cand=null; candAt=0;
  beep(); closeScan();
  if(m==='pt') gotPt(p); else if(m==='pk') gotPk(p); else handleCode(p);
}
function stopStream(){ try{ if(stream) stream.getTracks().forEach(t=>t.stop()); }catch(e){} stream=null; const v=$('#vid'); if(v) v.srcObject=null; }
function closeScan(){ scanning=false; cand=null; candAt=0; scanMode=''; stopStream(); $('#scan').classList.remove('on'); }
async function toggleTorch(){
  try{ const tr=stream.getVideoTracks()[0]; torchOn=!torchOn; await tr.applyConstraints({advanced:[{torch:torchOn}]}); }catch(e){ toast('這支手機不支援'); }
}
async function scanFile(file){
  if(!file) return;
  const inScan=$('#scan').classList.contains('on');
  if(inScan) scanSt('辨識中…'); else toast('辨識中…',8000);
  try{
    const det=await getDetector();
    let src=file;
    try{
      const bmp=await createImageBitmap(file);
      const k=Math.min(1,2400/Math.max(bmp.width,bmp.height));
      const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); src=c;
    }catch(e){}
    const best=pickBest(await det.detect(src));
    if(!best){ if(inScan) scanSt('這張照片找不到條碼，再拍一次'); else toast('這張照片找不到條碼'); return; }
    $('#toast').style.display='none';
    accept(best);
  }catch(e){ if(inScan) scanSt('辨識失敗'); else toast('辨識失敗'); }
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&$('#scan').classList.contains('on')) closeScan(); });

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{ const c=e.target.closest&&e.target.closest('input[data-cal]'); if(c&&c.showPicker){ try{ c.showPicker(); }catch(x){} } },true);
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='scan') openScan();
  else if(a==='scanClose') closeScan();
  else if(a==='photo'){ unlockAudio(); $('#photo').value=''; $('#photo').click(); }
  else if(a==='manual') doManual();
  else if(a==='tile') tileSheet(el.dataset.k);
  else if(a==='pinkey') pinKey(el.dataset.k);
  else if(a==='setme') whoPick(el.dataset.n);
  else if(a==='whoth'){ authUI.other=!authUI.other; render(); const i=$('#who-in'); if(i) i.focus(); }
  else if(a==='setme-in'){ const v=($('#who-in').value||'').trim(); if(!v){ toast('請輸入名字'); return; }
    if(!await ask('你是<b>'+esc(v)+'</b>？','是我','選錯了')) return; authDone(v,null); }   // 支援人力（名單上沒有）：不用密碼，跟點班一樣
  else if(a==='authlist'){ authReset('list'); render(); window.scrollTo({top:0}); }
  else if(a==='authme'){ authReset(); render(); window.scrollTo({top:0}); }
  else if(a==='who'){ if(SH) closeSheet(); ME=''; authReset(); render(); window.scrollTo({top:0}); }
  else if(a==='mjump'){ const k=el.dataset.k; mgOpen.add(k); render(); const d=document.querySelector('[data-sec="m_'+k+'"]'); if(d){ d.open=true; postH();
      if(window.parent!==window) try{ parent.postMessage({sup:1,h:mgH(),y:d.getBoundingClientRect().top+window.scrollY},'*'); }catch(e){} else d.scrollIntoView({behavior:'smooth'}); } }
  else if(a==='item'){ openItem(el.dataset.id); }
  else if(a==='close'){
    if(SH&&SH.type==='item'&&ED&&ED.dirty&&!await ask('還沒儲存，<b>放棄修改</b>？','放棄修改','繼續編輯')) return;
    closeSheet();
  }
  else if(a==='addRow'){ ED.rows.push({m:'',e:'',l:'',n:1,hl:1}); markDirty(); drawItem(); }
  else if(a==='delRow'){ ED.rows.splice(+el.dataset.i,1); markDirty(); drawItem(); }
  else if(a==='inc'||a==='dec'){ const r=ED.rows[+el.dataset.i]; r.n=Math.max(0,(parseInt(r.n,10)||0)+(a==='inc'?1:-1)); markDirty(); drawItem(); }
  else if(a==='saveItem') saveItem();
  else if(a==='bindTo') bindTo(el.dataset.id);
  else if(a==='whereTo'){ const p=WH; WH=null; openItem(el.dataset.id,p); }
  else if(a==='unbind') unbind(el.dataset.code);
  else if(a==='addItem') openAdd();
  else if(a==='editItem'){
    if(ED&&ED.dirty&&!await ask('效期／數量還沒儲存，<b>放棄修改</b>？','放棄修改','繼續編輯')) return;
    openEdit(ED.id);
  }
  else if(a==='addSz'){ splitSizes(FM.szIn).forEach(z=>{ if(FM.sizes.indexOf(z)<0) FM.sizes.push(z); }); FM.szIn=''; drawForm(); const i=document.querySelector('[data-fm=szIn]'); if(i) i.focus(); }
  else if(a==='delSz'){ FM.sizes.splice(+el.dataset.i,1); drawForm(); }
  else if(a==='pickArea'){ if(el.dataset.a){ FM.area=el.dataset.a; FM.other=false; } else FM.other=true; drawForm(); if(FM.other){ const i=document.querySelector('[data-fm=areaText]'); if(i) i.focus(); } }
  else if(a==='saveNew') saveNew();
  else if(a==='saveEdit') saveEdit();
  else if(a==='formCancel') backFromForm();
  else if(a==='hideItem') hideItem();
  else if(a==='unhide') unhide(el.dataset.id);
  // 高貴衛材使用登記
  else if(a==='uNew') openUse();
  else if(a==='uItem'){ UF.i=el.dataset.id; if(UF.sc&&DB.codes[UF.sc.key]!==UF.i) UF.sc=null; UF.dirty=true; drawUse(); }
  else if(a==='uShift'){ UF.k=el.dataset.k; UF.dirty=true; drawUse(); schedOn(UF.d).then(()=>{ if(UF) drawUse(); }); }
  else if(a==='uWho'){ if(el.dataset.n){ UF.u=el.dataset.n; UF.uo=false; } else { UF.uo=true; UF.u=''; } UF.dirty=true; drawUse(); if(UF.uo){ const i=$('#uf-ut'); if(i) i.focus(); } }
  else if(a==='uDec'||a==='uInc'){ UF.n=Math.max(1,(+UF.n||1)+(a==='uInc'?1:-1)); UF.dirty=true; drawUse(); }
  else if(a==='uScanPt'){ scanMode='pt'; openScan(); }
  else if(a==='uScanPk'){ scanMode='pk'; openScan(); }
  else if(a==='uClose'){ if(UF&&UF.dirty&&!await ask('還沒登記，<b>放棄</b>？','放棄','繼續填')) return; closeSheet(); }
  else if(a==='uSave') saveUse();
  else if(a==='uCx') cancelUse(el.dataset.id);
  // 後台設定
  else if(a==='hvUndo'){ HVD=null; render(); }
  else if(a==='hvSave') hvSave();
  else if(a==='accT'){ const n=el.dataset.n; ACD=(ACD||(ST.acc||[])).slice(); const i=ACD.indexOf(n); if(i>=0) ACD.splice(i,1); else ACD.push(n); render(); }
  else if(a==='accUndo'){ ACD=null; render(); }
  else if(a==='accSave') accSave();
});
$('#torch').addEventListener('click',toggleTorch);
$('#photo').addEventListener('change',e=>scanFile(e.target.files&&e.target.files[0]));
document.addEventListener('input',e=>{
  const t=e.target;
  if(UF&&t.dataset.uf){
    if(t.dataset.uf==='p'){ const v=t.value.replace(/\D/g,'').slice(0,3); if(v!==t.value) t.value=v; }
    if(t.dataset.uf!=='d') UF[t.dataset.uf]=t.value;
    UF.dirty=true; return;
  }
  if(FM&&t.dataset.fm){ if(t.type==='checkbox') FM[t.dataset.fm]=t.checked; else FM[t.dataset.fm]=t.value; return; }
  if(ED&&t.dataset.cal){   // 日曆鈕選的日期
    const r=ED.rows[+t.dataset.i], f=t.dataset.cal; if(!r) return;
    r[f]=t.value||''; delete r[f+'T']; delete r[f+'X'];
    const tx=t.closest('.dt').querySelector('input[type=text]'); if(tx){ tx.value=fmtD(r[f]); tx.classList.remove('bad'); }
    rowTint(+t.dataset.i); markDirty(); return;
  }
  if(!ED||t.dataset.f==null) return;
  const r=ED.rows[+t.dataset.i]; if(!r) return;
  if(t.dataset.f==='m'||t.dataset.f==='e'){   // 打字的日期：自動補「/」，打完整就先算進去
    const v=maskDate(t.value); if(v!==t.value) t.value=v;
    const p=parseDateIn(v), f=t.dataset.f;
    r[f+'T']=v; if(p!==null){ r[f]=p; if(p) rowTint(+t.dataset.i); } else r[f]='';
    if(r[f+'X']&&p!==null){ delete r[f+'X']; t.classList.remove('bad'); }
    markDirty(); return;
  }
  r[t.dataset.f]=t.value;
  markDirty();
  const q=document.querySelector('.qline b'); if(q) q.textContent=ED.rows.reduce((a,r)=>a+(+r.n||0),0);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(UF&&t.dataset.uf==='d'){ if(isD(t.value)){ UF.d=t.value; UF.dirty=true; schedOn(UF.d).then(()=>{ if(UF) drawUse(); }); } return; }
  if(MANAGE&&t.dataset.hv){ if(!HVD) HVD=new Set(DB.items.filter(i=>i.hv).map(i=>i.id)); if(t.checked) HVD.add(t.dataset.hv); else HVD.delete(t.dataset.hv); render(); return; }
  if(FM&&t.dataset.fm&&t.type==='checkbox'){ FM[t.dataset.fm]=t.checked; return; }
  if(ED&&t.dataset&&(t.dataset.f==='m'||t.dataset.f==='e')&&t.type==='text') commitDate(t);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&FM&&e.target.dataset&&e.target.dataset.fm==='szIn'){ e.preventDefault(); document.querySelector('[data-act=addSz]').click(); }
  if(e.key==='Enter'&&e.target.id==='who-in'){ e.preventDefault(); document.querySelector('[data-act=setme-in]').click(); }
});
window.addEventListener('beforeunload',e=>{ if(ED&&ED.dirty){ e.preventDefault(); e.returnValue=''; } });

if(EMBED) document.body.classList.add('emb');
derive(); render();
pullAll(); setInterval(pullAll,20000);
{ // 名單、衛材點班權限：打開時讀，讀不到 3 秒後再試；回到 App、每 10 分鐘再讀一次
  const ls=()=>loadStaff().then(ok=>{ if(ok&&!typing()) render(); return ok; });
  ls().then(ok=>{ if(!ok) setTimeout(ls,3000); });
  setInterval(()=>{ if(!document.hidden) ls(); },10*60e3);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&Date.now()-ST.at>60e3) ls(); });
}
if(MANAGE&&window.ResizeObserver) new ResizeObserver(postH).observe(document.querySelector('main'));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pullAll(); });
window.addEventListener('online',pullAll);
</script>
